<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大象的口袋海 · 立体绘本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender bedtime picture book, quiet and warm
   IDEA: a felt-and-paper pop-up book lying open on a desk
   PICTURE: the open book in 3D, cutouts standing up, characters acting out the script
   COLOUR: sky that shifts dusk peach → moon indigo → morning cream; mustard accent from Doudou's overalls
   TYPE: ZCOOL KuaiLe for titles, Noto Serif SC for story text; LAYOUT: full-bleed stage, small header, controls at bottom */
:root{--a:#f2c7a5;--b:#8f7c9e;--ink:#2b2420;--paper:#f6eedf;--mustard:#d9a326;--deep:#1f2c55}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--a),var(--b));color:var(--ink);font:16px/1.55 "Noto Serif SC",serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
header{position:fixed;left:16px;top:12px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.brand{pointer-events:auto;background:rgba(246,238,223,.88);border-radius:14px;padding:8px 14px 9px;box-shadow:0 6px 20px rgba(20,20,40,.18)}
.brand b{display:block;font:32px/1.05 "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
.brand span{font-size:13px;color:#6b5b4a}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
button{font:inherit;font-size:15px;border:0;border-radius:999px;min-height:44px;padding:0 16px;background:rgba(246,238,223,.92);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(20,20,40,.16)}
button:hover{background:#fff}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
button.pri{background:var(--mustard);color:#2b1d05;font-weight:700}
footer{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:5;width:min(680px,calc(100% - 24px))}
.bar{flex:1;display:flex;align-items:center;gap:12px;background:rgba(246,238,223,.94);border-radius:18px;padding:8px 10px 8px 16px;box-shadow:0 8px 24px rgba(20,20,40,.2)}
.bar .t{flex:1}
.bar .t small{display:block;font-size:13px;color:#7a6a58}
.bar .t strong{font:20px/1.2 "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:#7a6a58;white-space:nowrap}
.arrow{width:48px;padding:0;font-size:22px}
#cap{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(640px,calc(100% - 32px));background:rgba(31,44,85,.88);color:#f6eedf;padding:10px 18px;border-radius:14px;font-size:17px;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
#cap.on{opacity:1}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:#fffaf0;border:2px solid #3b2f25;border-radius:18px;padding:7px 13px;font-size:16px;max-width:240px;width:max-content;box-shadow:0 4px 0 rgba(59,47,37,.25);animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:9px solid transparent;border-top-color:#3b2f25;border-bottom:0}
.bub::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0;z-index:1}
.bub i{display:block;font-style:normal;font-size:12px;color:#8a7764}
.bub.sfx{background:none;border:0;box-shadow:none;font:24px "ZCOOL KuaiLe",sans-serif;color:#fff;text-shadow:0 2px 0 #1f2c55,0 0 12px rgba(80,170,220,.9)}
.bub.sfx::after,.bub.sfx::before{display:none}
@keyframes pop{from{transform:translate(-50%,calc(-100% - 4px)) scale(.6);opacity:0}}
#hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;z-index:2;transition:opacity .4s}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--deep);color:#f3dfb0;z-index:20;font:24px "ZCOOL KuaiLe",sans-serif;transition:opacity .6s}
#load small{display:block;font:14px "Noto Serif SC",serif;opacity:.7;text-align:center;margin-top:8px}
#toc{position:fixed;inset:0;background:rgba(15,20,40,.5);display:none;place-items:center;z-index:10}
#toc.on{display:grid}
#toc .card{background:var(--paper);border-radius:20px;padding:22px 22px 16px;width:min(420px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.35)}
#toc h2{margin:0 0 10px;font:28px "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
#toc ol{list-style:none;margin:0;padding:0}
#toc li button{width:100%;text-align:left;margin:4px 0;box-shadow:none;background:#efe3cc;border-radius:12px;display:flex;gap:10px}
#toc li button span{color:#8a7764;font-variant-numeric:tabular-nums}
@media(max-width:600px){.brand b{font-size:20px;white-space:nowrap}.brand span{display:none}.tools button{padding:0 12px;font-size:14px}#hint{display:none}.bar .t strong{font-size:17px}#cap{bottom:92px;font-size:15px}}
@media(prefers-reduced-motion:reduce){.bub{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bubbles"></div>
<header>
  <div class="brand"><b>大象的口袋海</b><span>一本会动的毛毡立体书</span></div>
  <div class="tools">
    <button id="bReset">重置视角</button>
    <button id="bToc">目录</button>
    <button id="bSnd" aria-pressed="true">声音：开</button>
  </div>
</header>
<div id="cap"></div>
<div id="hint">拖动书页翻页 · 点一点小象和小羊</div>
<footer>
  <button class="arrow" id="bPrev" aria-label="上一页">‹</button>
  <div class="bar">
    <div class="t"><small id="sub">封面</small><strong id="ttl">大象的口袋海</strong></div>

    <button class="pri" id="bPlay">▶ 读这一页</button>
  </div>
  <button class="arrow" id="bNext" aria-label="下一页">›</button>
</footer>
<div id="toc"><div class="card"><h2>目录</h2><ol id="tocList"></ol><p style="margin:10px 0 0;text-align:right"><button id="bTocX">关闭</button></p></div></div>
<div id="load"><div>正在展开绘本…<small id="lp">0%</small></div></div>

<script type="module">
import * as THREE from 'three';
{
const $=id=>document.getElementById(id);
const PI=Math.PI, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?2*t*t:1-(-2*t+2)**2/2, eout=t=>1-(1-t)**3, eback=t=>{const c=1.6;return 1+(c+1)*(t-1)**3+c*(t-1)**2};

/* ---------- story: the rewritten script, one entry per spread ---------- */
const SP=[
 {t:'大象的口袋海',sub:'封面',light:'dusk'},
 {t:'刚搬到山上',sub:'第一页 · 傍晚',light:'dusk',
  text:'搬到山上的第一天，小象豆豆从海边带来了一枚贝壳。住在草丘上的小羊毛毛跑过来，给新邻居看山坡上的一条小路。',
  quote:'「下雨的时候，水就顺着这条沟，一路跑进池塘里。」'},
 {t:'贝壳里的海',sub:'第二页 · 入夜',light:'night',
  text:'夜里的山坡好安静。豆豆把贝壳贴到耳边，壳里传来很远很远的一声「哗——」。贝壳往哪边歪，壳沿的水珠就往哪边拐。',
  quote:'「这儿晚上好安静啊。我想听海了。」'},
 {t:'口袋起浪',sub:'第三页 · 深夜',light:'night',
  text:'口袋忽然鼓了起来。一股蓝蓝的水从袋口涌出，在豆豆脚边卷成一个浪头，朝着熟睡的羊群滚过去。',
  quote:'「毛毛！快醒醒！」'},
 {t:'浪绕过小羊',sub:'第四页 · 月光',light:'night',
  text:'豆豆想起毛毛说过的小路。它举起贝壳，把壳口转向沟口——浪头一拐，钻进干水沟，绕过草丘，落进了池塘。',
  quote:'「刚才是什么声音？」'},
 {t:'一起听海',sub:'第五页 · 月夜到清晨',light:'night',
  text:'「是我家那边的海。今晚，我有点想它。」毛毛挨着豆豆坐下：「我也能听吗？」两个好朋友凑到贝壳边，听了一整个来回。',
  quote:'从那天起，山上也有了一片小小的海。'}
];
const N=SP.length-1;

/* ---------- renderer / scene ---------- */
const cv=$('stage');
let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){$('load').firstElementChild.innerHTML='这个浏览器没法开启 3D 画面<small>请用电脑或手机上的 Chrome、Safari、Edge 打开，并确认已开启硬件加速。</small>';throw e}
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(34,1,.05,30);
const hemi=new THREE.HemisphereLight('#ffe2c8','#7a6a58',1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffc08a',2.2);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-1.4,right:1.4,top:1.4,bottom:-1.4,near:.1,far:8});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.01;scene.add(sun,sun.target);
const lamp=new THREE.PointLight('#ffb35c',0,.7,2);lamp.position.set(-.6,.26,-.38);scene.add(lamp);

/* table */
const tableM={color:new THREE.Color()};
const table=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:.28}));table.rotation.x=-PI/2;table.position.y=-.05;table.receiveShadow=true;scene.add(table);

/* ---------- assets ---------- */
const META={"shell":{"w":1090,"h":785},"dd_stand":{"w":933,"h":1155},"dd_step":{"w":930,"h":1137},"dd_hold":{"w":868,"h":1155,"shell":[0.7627,0.5013],"shellW":0.167},"mm_stand":{"w":982,"h":904},"mm_sleep":{"w":1168,"h":738},"mount":{"w":2126,"h":351},"house":{"w":1078,"h":950},"hill":{"w":2075,"h":414},"flowers":{"w":1390,"h":657},"channel":{"w":1571,"h":818,"path":[[0.0223,0.0477],[0.0948,0.1112],[0.1362,0.2176],[0.1088,0.3313],[0.0509,0.4303],[0.0439,0.5306],[0.0898,0.6284],[0.1776,0.7127],[0.3074,0.7433],[0.4379,0.7066],[0.5659,0.6443],[0.6957,0.6271],[0.8084,0.6846],[0.8854,0.8264],[0.944,0.9169],[0.986,0.9438]]},"pond":{"w":1350,"h":617,"inner":[0.0741,0.1442,0.9185,0.8736]},"wave":{"w":1352,"h":797},"water":{"w":1592,"h":633},"drop":{"w":663,"h":849},"moon":{"w":766,"h":783},"grass":{"w":1055,"h":1491},"cover":{"w":1086,"h":1448}};
const asp=k=>META[k].w/META[k].h;
const TX={};
const loader=new THREE.TextureLoader();
async function loadAll(){
  const keys=Object.keys(META);let n=0;
  await Promise.all(keys.map(k=>loader.loadAsync(`art/${k}.webp`).then(t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;TX[k]=t;$('lp').textContent=Math.round(++n/keys.length*100)+'%'})));
  await Promise.all(['36px "Noto Serif SC"','700 36px "Noto Serif SC"','60px "ZCOOL KuaiLe"'].map(f=>document.fonts.load(f,'大象的口袋海豆豆毛毛').catch(()=>0)));
}

/* ---------- layout on the open spread (x -1..1, z -0.7..0.7) ---------- */
const CH={x0:-.58,z0:-.47,w:1.2}; CH.d=CH.w/asp('channel');
const PD={cx:.74,cz:.05,w:.46}; PD.d=PD.w/asp('pond');
const HOME=[-.74,-.3], SLOT=[.13,-.19];
const pathW=META.channel.path.map(([u,v])=>new THREE.Vector3(CH.x0+u*CH.w,.004,CH.z0+v*CH.d));
const curve=new THREE.CatmullRomCurve3(pathW);
const uNear=p=>{let b=0,bd=9;for(let i=0;i<=400;i++){const q=curve.getPointAt(i/400);const d=q.distanceTo(p);if(d<bd){bd=d;b=i/400}}return b};
const U5=uNear(pathW[5]);

/* ---------- page textures (canvas) ---------- */
const CW=900, CHT=1260, SCN=.92/1.4*CHT;
function wrapText(c,txt,x,y,maxW,lh){let line='';for(const ch of txt){if(c.measureText(line+ch).width>maxW&&line){c.fillText(line,x,y);y+=lh;line=ch.trim()?ch:''}else line+=ch}if(line)c.fillText(line,x,y);return y+lh}
function paperBase(c){c.fillStyle='#f6eedf';c.fillRect(0,0,CW,CHT);for(let i=0;i<2600;i++){c.fillStyle=`rgba(120,90,60,${Math.random()*.05})`;c.fillRect(Math.random()*CW,Math.random()*CHT,2,2)}}
function pageCanvas(i,side){
  const c=document.createElement('canvas');c.width=CW;c.height=CHT;const g=c.getContext('2d');
  if(i===0){ // cover
    g.drawImage(TX.cover.image,0,0,CW,CHT);
    g.textAlign='center';g.fillStyle='#f3dfb0';g.font='104px "ZCOOL KuaiLe"';g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=8;
    g.fillText('大象的口袋海',CW/2,250);g.shadowBlur=0;g.font='34px "Noto Serif SC"';g.fillStyle='#d9c79c';g.fillText('一本会动的毛毡立体书',CW/2,312);
    return c;
  }
  const s=SP[i], ox=side==='L'?-1:0;
  const W2C=(x,z)=>[(x-ox)*CW,(z+.7)/1.4*CHT];
  paperBase(g);
  // grass with a soft wavy edge
  g.save();g.beginPath();g.moveTo(0,0);g.lineTo(CW,0);
  for(let x=CW;x>=0;x-=30){g.lineTo(x,SCN+Math.sin((x+ox*CW)*.02)*9+Math.sin((x+ox*CW)*.053)*5)}
  g.closePath();g.clip();g.drawImage(TX.grass.image,0,0,CW,CW*META.grass.h/META.grass.w);
  const [cx,cy]=W2C(CH.x0,CH.z0);g.drawImage(TX.channel.image,cx,cy,CH.w*CW,CH.d/1.4*CHT);
  const [px,py]=W2C(PD.cx-PD.w/2,PD.cz-PD.d/2);g.drawImage(TX.pond.image,px,py,PD.w*CW,PD.d/1.4*CHT);
  g.restore();
  g.strokeStyle='rgba(90,110,40,.35)';g.lineWidth=3;g.beginPath();
  for(let x=0;x<=CW;x+=30){const y=SCN+Math.sin((x+ox*CW)*.02)*9+Math.sin((x+ox*CW)*.053)*5;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  // text
  g.fillStyle='#3b2f25';g.textAlign='left';
  if(side==='L'){
    g.font='30px "Noto Serif SC"';g.fillStyle='#8a7764';g.fillText(s.sub,86,SCN+78);
    g.font='58px "ZCOOL KuaiLe"';g.fillStyle='#1f2c55';g.fillText(s.t,86,SCN+148);
    g.font='31px "Noto Serif SC"';g.fillStyle='#3b2f25';wrapText(g,s.text,86,SCN+208,CW-150,48);
  }else{
    g.font='700 36px "Noto Serif SC"';g.fillStyle='#3b2f25';wrapText(g,s.quote,70,SCN+130,CW-160,58);
    g.font='28px "Noto Serif SC"';g.fillStyle='#8a7764';g.textAlign='right';g.fillText(`— ${i} —`,CW-60,CHT-50);
  }
  // spine shade
  const gr=side==='L'?g.createLinearGradient(CW,0,CW-90,0):g.createLinearGradient(0,0,90,0);
  gr.addColorStop(0,'rgba(60,40,20,.28)');gr.addColorStop(1,'rgba(60,40,20,0)');g.fillStyle=gr;g.fillRect(0,0,CW,CHT);
  return c;
}
const PT=[];
function mkTex(c,mirror){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(mirror){t.wrapS=THREE.RepeatWrapping;t.repeat.x=-1}return t}
function buildPages(){for(let i=0;i<=N;i++){
  const L=i?pageCanvas(i,'L'):null, Rc=pageCanvas(i,'R');
  PT[i]={L:L&&mkTex(L),Lm:L&&mkTex(L,true),R:mkTex(Rc)};
}}

/* ---------- book ---------- */
const pageMat=()=>new THREE.MeshStandardMaterial({roughness:.95,emissive:'#ffffff',emissiveIntensity:.1});
const book=new THREE.Group();scene.add(book);
const boardM=new THREE.MeshStandardMaterial({color:'#1f2c55',roughness:.9});
const blockM=new THREE.MeshStandardMaterial({color:'#efe4cf',roughness:1});
function half(x){const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.06,.012,1.48),boardM);b.position.set(x*1.03/2+x*.01,-.042,0);b.receiveShadow=true;
  const k=new THREE.Mesh(new THREE.BoxGeometry(1,.034,1.4),blockM);k.position.set(x*.5,-.018,0);k.receiveShadow=true;g.add(b,k);book.add(g);return g}
const halfL=half(-1), halfR=half(1);
const pgGeo=new THREE.PlaneGeometry(1,1.4).rotateX(-PI/2);
const pageL=new THREE.Mesh(pgGeo,pageMat()),pageR=new THREE.Mesh(pgGeo,pageMat());
pageL.position.set(-.5,.0005,0);pageR.position.set(.5,.0005,0);pageL.receiveShadow=pageR.receiveShadow=true;book.add(pageL,pageR);
// turning leaf
const COLS=40, leafGeo=new THREE.PlaneGeometry(1,1.4,COLS,1).rotateX(-PI/2).translate(.5,0,0);
const leafS=Float32Array.from({length:leafGeo.attributes.position.count},(_,i)=>leafGeo.attributes.position.getX(i));
const leafF=new THREE.Mesh(leafGeo,pageMat()),leafB=new THREE.Mesh(leafGeo,pageMat());
leafB.material.side=THREE.BackSide;leafF.castShadow=leafB.castShadow=true;leafF.visible=leafB.visible=false;book.add(leafF,leafB);
const PAGE_MATS=[pageL.material,pageR.material,leafF.material,leafB.material],CUT_MATS=[];
function setLeaf(p){
  const k=.9*Math.sin(p*PI), xs=[],ys=[];let x=0,y=0;
  for(let i=0;i<=COLS;i++){const s=i/COLS;xs.push(x);ys.push(y);const ph=p*PI-k*(s-.35);x+=Math.cos(ph)/COLS;y+=Math.sin(ph)/COLS}
  const pos=leafGeo.attributes.position;
  for(let i=0;i<pos.count;i++){const c=Math.round(leafS[i]*COLS);pos.setX(i,xs[c]);pos.setY(i,ys[c]+.003+.002*Math.sin(p*PI))}
  pos.needsUpdate=true;leafGeo.computeVertexNormals();
}

/* ---------- pop-up cutouts & actors ---------- */
const POPS=[];
const geo1=new THREE.PlaneGeometry(1,1).translate(0,.5,0);
class Actor{
  constructor(poses,h,x,z,o={}){
    this.poses=poses;this.h=h;this.dir=1;this.sc=1;this.lean=0;this.jump=0;this.lift=0;this.f=0;this.on=true;this.talk=0;this.ph=Math.random()*9;this.sway=o.sway??.012;this.order=o.order??5;this.name=o.name;
    this.g=new THREE.Group();this.hinge=new THREE.Group();this.body=new THREE.Group();
    this.mat=new THREE.MeshStandardMaterial({alphaTest:.5,side:THREE.DoubleSide,roughness:1,emissive:'#ffffff',emissiveIntensity:.1});CUT_MATS.push(this.mat);
    this.mesh=new THREE.Mesh(geo1,this.mat);this.mesh.castShadow=true;this.mesh.userData.actor=this;
    this.mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,alphaTest:.5});
    this.g.add(this.hinge);this.hinge.add(this.body);this.body.add(this.mesh);book.add(this.g);
    this.g.position.set(x,0,z);this.setPose(Object.keys(poses)[0]);POPS.push(this);
  }
  setPose(n){this.pose=n;const p=this.poses[n];this.mat.map=this.mat.emissiveMap=TX[p.k];this.mesh.customDepthMaterial.map=TX[p.k];this.mat.needsUpdate=true;this.mesh.customDepthMaterial.needsUpdate=true;this.nat=p.nat||0;this.asp=asp(p.k);this.H=p.h||this.h}
  at(x,z){this.g.position.x=x;this.g.position.z=z;return this}
  face(d){this.dir=d;return this}
  top(){return this.mesh.localToWorld(new THREE.Vector3(0,1.04,0))}
  update(t,G){
    this.g.visible=this.on&&this.f*G>.001;
    this.hinge.rotation.x=-(1-this.f*G)*PI/2;

  await R.tw(5600,t=>{const u=lerp(U5,1,t),q=curve.getPointAt(u);if(Math.abs(q.x-lx)>.002)wave.face(q.x>lx?1:-1);lx=q.x;wave.at(q.x,q.z);wave.sc=lerp(1,.38,t);RB.b=u;camT.x=lerp(-.07,.11,t);
    if(t>.42&&!said){said=true;bubble(s1,'咩……（梦话）','',1600)}},x=>x);
  S.wave(.35,2.2);
  await R.all(R.tw(1400,t=>{wave.sc=.38*(1-t);FX.water=eout(t)}),R.say(wave,'哗啦啦……',{sfx:1,ms:1300}));
  wave.on=false;tween(1500,t=>{FX.refl=t});ripple(WAT.x,WAT.z,1.4);
  R.cam(.2,-.12,.9);
  await R.narr('浪绕过了小羊，落进池塘。小羊们的草窝还是干干的。');
  mm.setPose('stand');mm.dir=1;await R.jump(mm,.05);
  await R.say(mm,'嗯？刚才是什么声音？');
  await R.walk(mm,.44,.035,{speed:.3,hop:.022,hopMs:200});mm.face(-1);S.hoof();
  dd.setPose('stand');shellSet('pocket');
  await R.all(R.say(dd,'毛毛，等等我！'),R.walk(dd,.22,.1,{alt:'step',speed:.32,hopMs:200,hop:.01}));
  dd.setPose('hold');shellSet('hand');dd.face(1);
 },
 async R=>{ // 5 一起听海
  R.cam(.36,-.06,.72);
  await R.say(mm,'池塘里怎么一下子有水了？');
  await R.tw(500,t=>{dd.lean=.06*t});
  await R.say(dd,'是我家那边的海。今晚，我有点想它。');
  await R.tw(400,t=>{dd.lean=.06*(1-t)});
  await R.walk(mm,.41,.04,{speed:.12,hop:.01});mm.face(-1);
  await R.say(mm,'我也能听吗？');
  await R.say(dd,'你再靠近一点。');
  await R.all(R.tw(800,t=>{dd.lean=-.13*t;mm.lean=.11*t}),shellTo('up',800));
  S.wave(.3,2.4);ripple(WAT.x,WAT.z);
  await R.all(R.say(dd,'哗……',{sfx:1,ms:1400}));
  S.wave(.22,2.4);ripple(WAT.x+.05,WAT.z+.02,.8);
  await R.say(mm,'哗……',{sfx:1,ms:1400});
  await R.narr('两个好朋友把耳朵凑到贝壳边，听了一整个来回。');
  R.cam(0,-.2,1);
  await R.all(R.tw(800,t=>{dd.lean=-.13*(1-t);mm.lean=.11*(1-t)}),shellTo('hand',800));
  await R.all(R.mood('morning'),R.tw(2400,t=>{moon.lift=-.2*t;FX.refl=1-t}),R.narr('第二天清晨。'));
  s1.setPose('stand');s3.setPose('stand');
  await R.all(R.walk(s1,-.45,-.03,{speed:.1,hop:.012}),R.walk(s3,-.12,.06,{speed:.1,hop:.012}),R.say(mm,'听，山上的风来了。'),R.tw(2500,t=>{flL.lean=flR.lean=Math.sin(t*PI*4)*.06},x=>x));
  S.rustle();R.cam(.36,-.06,.72);
  await shellTo('up',600);
  const from=shellG.localToWorld(new THREE.Vector3(0,0,0)).sub(book.position);
  S.drip();await R.all(dropFall(from,.06,800),R.say(dd,'滴',{sfx:1,ms:700}));
  ripple(from.x+.06,Math.min(from.z,WAT.z+.05),1.2);
  await R.narr('从那天起，山上也有了一片小小的海。',{ms:3200});
  R.cam(0,-.2,1);
  await R.say(dd,'— 完 —',{sfx:1,ms:2200});
 }
];

/* ---------- page state, turning, playing ---------- */
let cur=0, T=null, playing=false;
function setStatic(){
  const sL=T?(T.dir>0?T.from:T.to):cur, sR=T?(T.dir>0?T.to:T.from):cur;
  pageL.visible=sL>0;if(sL>0)pageL.material.map=PT[sL].L;pageL.material.emissiveMap=pageL.material.map;pageL.material.needsUpdate=true;
  pageR.material.map=pageR.material.emissiveMap=PT[sR].R;pageR.material.needsUpdate=true;
  halfL.visible=pageL.visible||!!T;
  if(T){const a=Math.min(T.from,T.to);leafF.material.map=leafF.material.emissiveMap=PT[a].R;leafB.material.map=leafB.material.emissiveMap=PT[a+1].Lm;leafF.material.needsUpdate=leafB.material.needsUpdate=true}
  leafF.visible=leafB.visible=!!T;
}
function ui(){const s=SP[cur];$('ttl').textContent=s.t;$('sub').textContent=s.sub;$('cnt').textContent=cur?`${String(cur).padStart(2,'0')} / ${String(N).padStart(2,'0')}`:'封面';
  $('bPrev').disabled=cur===0;$('bNext').disabled=cur===N;$('bPlay').textContent=cur===0?'▶ 打开绘本':playing?'■ 停下':'▶ 读这一页'}
function stop(){RUN++;playing=false;clearBubs();try{speechSynthesis.cancel()}catch(e){}for(const a of ACT)a.talk=0;ui()}
function rise(){const list=POPS.filter(a=>a.on).sort((a,b)=>a.order-b.order);list.forEach(a=>a.f=0);
  S.rustle();return Promise.all(list.map((a,i)=>tween(200+i*70,()=>{},x=>x,false).then(()=>tween(650,t=>{a.f=t},eback,false))))}
async function play(){
  if(cur===0){go(1);return}
  stop();INIT[cur]();for(const a of POPS)if(a.on)a.f=1;
  if(cur===5)mood('night',10,false);
  const tok=RUN;playing=true;ui();
  try{await BEATS[cur](mkR(tok))}catch(e){if(e!==ABORT)console.error(e)}
  if(tok===RUN){playing=false;ui();camT.x=0;camT.z=CZ;camT.zoom=1}
}
function startTurn(dir){
  if(T)return false;const to=cur+dir;if(to<0||to>N)return false;
  stop();T={dir,from:cur,to,p:dir>0?0:1};setStatic();setLeaf(T.p);S.rustle();return true}
function animTurn(end){const p0=T.p,d=Math.abs(end-p0)*1100+150;T.anim=true;
  return tween(d,t=>{T.p=lerp(p0,end,t);setLeaf(T.p)},eio,false).then(()=>{const done=(T.dir>0&&end===1)||(T.dir<0&&end===0);
    if(done){const to=T.to;$('hint').style.opacity=0;cur=to;INIT[cur]();for(const a of POPS)a.f=0;T=null;setStatic();ui();if(SP[cur].light)mood(SP[cur].light,1200,false);
      camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;
      rise().then(()=>{if(cur===to&&!T&&cur>0)play()})}
    else{T=null;setStatic();ui()}})}
function go(i){if(T||i===cur)return;const dir=i>cur?1:-1;
  if(Math.abs(i-cur)>1){stop();cur=i-dir;INIT[cur]();for(const a of POPS)a.f=1;if(SP[cur].light)mood(SP[cur].light,300,false);setStatic()}
  if(startTurn(dir))animTurn(dir>0?1:0)}

/* ---------- camera ---------- */
const camT={x:.5,z:.02,zoom:.82}, camC={x:.5,z:.02,zoom:.82,px:0,py:0}, PTR={x:0,y:0};
const CZ=.02;
function fitD(){const a=innerWidth/innerHeight,v=34*PI/180,hf=2*Math.atan(Math.tan(v/2)*a);return Math.max(1.3/Math.tan(hf/2),1.16/Math.tan(v/2))}
function placeCam(dt){const k=1-Math.exp(-dt*2.2);for(const q of['x','z','zoom'])camC[q]+=(camT[q]-camC[q])*k;camC.px+=(PTR.x-camC.px)*k;camC.py+=(PTR.y-camC.py)*k;
  const D=fitD()*camC.zoom,el=(54+camC.py*4)*PI/180,az=camC.px*.07;
  cam.position.set(camC.x+Math.sin(az)*Math.cos(el)*D,Math.sin(el)*D,camC.z+Math.cos(az)*Math.cos(el)*D);cam.lookAt(camC.x,0,camC.z)}
function resize(){R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight,true);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------- input: drag to turn, tap to poke ---------- */
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();let DR=null;
cv.addEventListener('pointerdown',e=>{ac();DR={x:e.clientX,y:e.clientY,t:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{PTR.x=(e.clientX/innerWidth-.5)*2;PTR.y=(e.clientY/innerHeight-.5)*2;
  if(!DR)return;const dx=e.clientX-DR.x;
  if(!DR.t&&Math.abs(dx)>14&&!T){const dir=dx<0?1:-1;if(startTurn(dir)){DR.t=true;cv.classList.add('drag');$('hint').style.opacity=0}}
  if(DR.t&&T&&!T.anim){const q=clamp(Math.abs(dx)/(innerWidth*.45));T.p=T.dir>0?q:1-q;setLeaf(T.p)}});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(!DR)return;const d=DR;DR=null;
  if(d.t&&T&&!T.anim){const prog=T.dir>0?T.p:1-T.p;animTurn(prog>.28?(T.dir>0?1:0):(T.dir>0?0:1));return}
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)poke(e)});
cv.addEventListener('pointercancel',()=>{DR=null;if(T&&!T.anim)animTurn(T.dir>0?0:1)});
const POKE={
  '豆豆':['我叫豆豆！','贝壳里住着海哦。','嘿嘿，你好呀～','要不要一起听海？'],
  '毛毛':['咩～','我最熟悉这片山坡啦！','你好呀！'],
  '小羊':['咩！','咩咩～']};
function poke(e){if(playing||T)return;v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const hits=ray.intersectObjects([...POPS.filter(a=>a.on&&a.g.visible).map(a=>a.mesh),water]);if(!hits.length)return;
  const o=hits[0].object;if(o===water){if(FX.water>.5){ripple(hits[0].point.x,hits[0].point.z);S.drip()}return}
  const a=o.userData.actor;if(BUBS.some(b=>b.a===a))return;
  if(a.pose==='sleep'){bubble(a,'Zzz…','sfx',1200);return}
  if(a===wave){S.wave(.4,1.4);bubble(a,'哗啦！','sfx',1100);jump(a,.02,400,false);return}
  const L=POKE[a.name];if(!L)return;bubble(a,L[Math.floor(Math.random()*L.length)],'',1800);jump(a,.04);if(a!==dd)S.hoof();else S.pop()}

/* ---------- buttons ---------- */
$('bNext').onclick=()=>{ac();go(cur+1)};$('bPrev').onclick=()=>{ac();go(cur-1)};
$('bPlay').onclick=()=>{ac();if(playing){stop();camT.x=0;camT.z=CZ;camT.zoom=1}else play()};
$('bReset').onclick=()=>{camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;PTR.x=PTR.y=0};
$('bSnd').onclick=e=>{SND=!SND;e.currentTarget.textContent='声音：'+(SND?'开':'关');e.currentTarget.setAttribute('aria-pressed',SND);if(!SND)try{speechSynthesis.cancel()}catch(_){}};
$('tocList').innerHTML=SP.map((s,i)=>`<li><button data-i="${i}"><span>${i?String(i).padStart(2,'0'):'封面'}</span>${s.t}</button></li>`).join('');
$('tocList').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('toc').classList.remove('on');go(+b.dataset.i)};
$('bToc').onclick=()=>$('toc').classList.add('on');$('bTocX').onclick=()=>$('toc').classList.remove('on');
$('toc').onclick=e=>{if(e.target.id==='toc')$('toc').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();$('bPlay').click()}});

/* ---------- loop ---------- */
let last=performance.now();const V=new THREE.Vector3();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts;
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];if(w.tok!==null&&w.tok!==RUN){TW.splice(i,1);w.res();continue}
    const t=clamp((now-w.t0)/w.d);w.fn(w.ease(t));if(t>=1){TW.splice(i,1);w.res()}}
  const prog=T?(T.dir>0?T.p:1-T.p):0, G=T?clamp(1-prog/.3):1, t=ts/1000;
  for(const a of POPS)a.update(t,G);
  moon.mesh.position.y=0;
  // shell
  shellM.material.map=TX.shell;const sw=.05*SH.k;shellG.visible=SH.k>.02&&dd.on;
  shellG.position.set(SH.x,SH.y,.012);shellM.scale.set(sw*asp('shell')*SH.sw,sw,1);shellM.position.y=-.5*sw;
  // water
  rib.visible=RB.b>RB.a+.001&&G>.05;const i0=Math.floor(RB.a*RIB),i1=Math.ceil(RB.b*RIB);rib.geometry.setDrawRange(i0*6,Math.max(0,i1-i0)*6);rib.material.opacity=.95*G;flowTex.offset.x-=dt*1.2;
  water.material.map=TX.water;water.visible=FX.water>.01;water.scale.set(WAT.w*Math.max(.02,FX.water),1,WAT.d*Math.max(.02,FX.water));water.material.opacity=Math.min(1,FX.water*1.3)*G;
  refl.material.map=TX.moon;refl.visible=FX.refl>.01;refl.material.opacity=.6*FX.refl*G*(1+.15*Math.sin(t*2.3));refl.scale.set(1+.05*Math.sin(t*1.7),1,.7);
  dropS.material.map=TX.drop;
  for(const m of RINGS)m.visible=G>.5;
  placeCam(dt);R.render(scene,cam);
  // bubbles follow heads
  for(let i=BUBS.length-1;i>=0;i--){const b=BUBS[i];if(now>b.until||!b.a.g.visible){b.el.remove();BUBS.splice(i,1);continue}
    V.copy(b.a.top()).project(cam);b.el.style.left=clamp((V.x+1)/2*innerWidth,90,innerWidth-90)+'px';b.el.style.top=clamp((1-V.y)/2*innerHeight,80,innerHeight)+'px'}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async()=>{
  try{await loadAll()}catch(e){$('lp').textContent='图片加载失败，请刷新重试';return}
  dropS.material.map=TX.drop;shellM.material.map=TX.shell;for(const a of POPS)a.setPose(a.pose);
  buildPages();resize();Object.assign(LS,moodSnap('dusk'));applyLS();INIT[0]();setStatic();ui();
  requestAnimationFrame(frame);
  setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700)},300);
  if(/#?autoplay/.test(location.hash))setTimeout(()=>go(1),1200);
})();
}
