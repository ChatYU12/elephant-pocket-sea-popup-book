<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大象的口袋海 · 立体绘本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender bedtime picture book, quiet and warm
   IDEA: a felt-and-paper pop-up book lying open on a desk; every spread unfolds a new little stage
   PICTURE: the open book in 3D, cutouts standing up, characters acting out the script
   COLOUR: sky follows the story: sea-morning blue → afternoon gold → dusk peach → moon indigo → dawn cream; mustard accent
   TYPE: ZCOOL KuaiLe titles, Noto Serif SC story text; LAYOUT: full-bleed stage, small header, controls + page progress at bottom */
:root{--a:#bfe6f2;--b:#f6e6c8;--ink:#2b2420;--paper:#f6eedf;--mustard:#d9a326;--deep:#1f2c55}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--a),var(--b));color:var(--ink);font:16px/1.55 "Noto Serif SC",serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage.orbit{cursor:move}
header{position:fixed;left:16px;top:12px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.brand{pointer-events:auto;background:rgba(246,238,223,.88);border-radius:14px;padding:8px 14px 9px;box-shadow:0 6px 20px rgba(20,20,40,.18)}
.brand b{display:block;font:32px/1.05 "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
.brand span{font-size:13px;color:#6b5b4a}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
button{font:inherit;font-size:15px;border:0;border-radius:999px;min-height:44px;padding:0 16px;background:rgba(246,238,223,.92);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(20,20,40,.16)}
button:hover{background:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
button.pri{background:var(--mustard);color:#2b1d05;font-weight:700;white-space:nowrap}
footer{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:5;width:min(720px,calc(100% - 24px))}
.bar{flex:1;display:flex;align-items:center;gap:12px;background:rgba(246,238,223,.95);border-radius:18px;padding:8px 10px 8px 16px;box-shadow:0 8px 24px rgba(20,20,40,.2)}
.bar .t{flex:1}
.bar .t small{display:block;font-size:13px;color:#7a6a58}
.bar .t strong{font:20px/1.2 "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
.prog{display:flex;gap:4px;margin-top:6px;height:8px}
.prog i{flex:1;border-radius:4px;background:#e2d4bb;position:relative;overflow:hidden}
.prog i.done{background:var(--mustard)}
.prog i.now::after{content:"";position:absolute;inset:0;background:var(--mustard);transform-origin:left;animation:grow 1.6s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(.85)}}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:#7a6a58;white-space:nowrap}
.arrow{width:48px;padding:0;font-size:22px;flex:none}
#cap{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);max-width:min(640px,calc(100% - 32px));background:rgba(31,44,85,.88);color:#f6eedf;padding:10px 18px;border-radius:14px;font-size:17px;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
#cap.on{opacity:1}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:#fffaf0;border:2px solid #3b2f25;border-radius:18px;padding:7px 13px;font-size:16px;max-width:240px;width:max-content;box-shadow:0 4px 0 rgba(59,47,37,.25);animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:9px solid transparent;border-top-color:#3b2f25;border-bottom:0}
.bub::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0;z-index:1}
.bub i{display:block;font-style:normal;font-size:12px;color:#8a7764}
.bub.sfx{background:none;border:0;box-shadow:none;font:24px "ZCOOL KuaiLe",sans-serif;color:#fff;text-shadow:0 2px 0 #1f2c55,0 0 12px rgba(80,170,220,.9)}
.bub.sfx::after,.bub.sfx::before{display:none}
@keyframes pop{from{transform:translate(-50%,calc(-100% - 4px)) scale(.6);opacity:0}}
#hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap;z-index:2;transition:opacity .4s}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--deep);color:#f3dfb0;z-index:20;font:24px "ZCOOL KuaiLe",sans-serif;transition:opacity .6s;text-align:center;padding:20px}
#load small{display:block;font:14px "Noto Serif SC",serif;opacity:.75;margin-top:8px}
#toc{position:fixed;inset:0;background:rgba(15,20,40,.5);display:none;place-items:center;z-index:10}
#toc.on{display:grid}
#toc .card{background:var(--paper);border-radius:20px;padding:22px 22px 16px;width:min(420px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:calc(100% - 40px);overflow:auto}
#toc h2{margin:0 0 10px;font:28px "ZCOOL KuaiLe",sans-serif;color:var(--deep)}
#toc ol{list-style:none;margin:0;padding:0}
#toc li button{width:100%;text-align:left;margin:4px 0;box-shadow:none;background:#efe3cc;border-radius:12px;display:flex;gap:10px;align-items:center}
#toc li button span{color:#8a7764;font-variant-numeric:tabular-nums;min-width:2.4em}
#toc li button em{margin-left:auto;font-style:normal;font-size:13px;color:#8a7764}
@media(max-width:600px){#bRotL,#bRotR{width:44px;padding:0}.brand b{font-size:20px;white-space:nowrap}.brand span{display:none}.tools button{padding:0 12px;font-size:14px}#hint{display:none}.bar{gap:8px;padding-left:12px}.bar .t strong{font-size:16px}.count{display:none}#cap{bottom:100px;font-size:15px}.arrow{width:44px}}
@media(prefers-reduced-motion:reduce){.bub{animation:none}.prog i.now::after{animation:none;transform:scaleX(.5)}}
</style>

<body>
<canvas id="stage"></canvas>
<div id="bubbles"></div>
<header>
  <div class="brand"><b>大象的口袋海</b><span>一本会动的毛毡立体书</span></div>
  <div class="tools">
    <button id="bRotL" aria-label="向左转" title="向左转（Q）">↺</button>
    <button id="bRotR" aria-label="向右转" title="向右转（E）">↻</button>
    <button id="bReset">重置视角</button>
    <button id="bToc">目录</button>
    <button id="bSnd" aria-pressed="true">声音：开</button>
  </div>
</header>
<div id="cap"></div>
<div id="hint">拖动书页翻页 · 拖动书外空白处转动 · 滚轮缩放</div>
<footer>
  <button class="arrow" id="bPrev" aria-label="上一页">‹</button>
  <div class="bar">
    <div class="t"><small id="sub">封面</small><strong id="ttl">大象的口袋海</strong><div class="prog" id="prog" aria-label="这一页的进度"></div></div>
    <span class="count" id="cnt">封面</span>
    <button class="pri" id="bPlay">▶ 打开绘本</button>
  </div>
  <button class="arrow" id="bNext" aria-label="下一页">›</button>
</footer>
<div id="toc"><div class="card"><h2>目录</h2><ol id="tocList"></ol><p style="margin:10px 0 0;text-align:right"><button id="bTocX">关闭</button></p></div></div>
<div id="load"><div>正在展开绘本…<small id="lp">0%</small></div></div>

<script type="module">
import * as THREE from 'three';
{
const $=id=>document.getElementById(id);
const PI=Math.PI, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?2*t*t:1-(-2*t+2)**2/2, eout=t=>1-(1-t)**3, eback=t=>{const c=1.6;return 1+(c+1)*(t-1)**3+c*(t-1)**2};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---------- story: one entry per spread; scene = which little stage unfolds ---------- */
const SP=[
 {t:'大象的口袋海',sub:'封面',light:'day'},
 {t:'海边的家',sub:'第一页 · 早晨的沙滩',scene:'beach',light:'day',
  text:'豆豆的家原来在海边。搬家这天早上，它最后一次去沙滩散步。一个浪头退下去，把一枚粉色的贝壳留在了它的脚边。',
  quote:'「再见啦，大海。我会想你的。」'},
 {t:'上山的路',sub:'第二页 · 午后',scene:'road',light:'afternoon',
  text:'搬家小车摇摇晃晃，沿着山路往上开。回头看，大海越来越远，最后只剩一条细细的蓝线。豆豆一直按着胸前的口袋。',
  quote:'「贝壳，你也跟我一起去山上吧。」'},
 {t:'刚搬到山上',sub:'第三页 · 傍晚',scene:'hill',light:'dusk',
  text:'新家是山坡上的一座圆屋。住在草丘上的小羊毛毛跑过来，给新邻居看山坡上的一条小路。',
  quote:'「下雨的时候，水就顺着这条沟，一路跑进池塘里。」'},
 {t:'圆屋里的第一夜',sub:'第四页 · 夜里',scene:'room',light:'night',
  text:'第一个晚上，箱子还没拆完，新屋子里静悄悄的。豆豆睡不着，把贝壳贴到耳边——壳里传来很远很远的一声「哗——」。',
  quote:'「这儿晚上好安静啊。我想听海了。」'},
 {t:'口袋起浪',sub:'第五页 · 深夜',scene:'hill',light:'night',
  text:'豆豆走到门外看月亮。口袋忽然鼓了起来，一股蓝蓝的水从袋口涌出，卷成一个浪头，朝着熟睡的羊群滚过去。',
  quote:'「毛毛！快醒醒！」'},
 {t:'浪绕过小羊',sub:'第六页 · 月光',scene:'hill',light:'night',
  text:'豆豆想起毛毛说过的小路。它举起贝壳，把壳口转向沟口——浪头一拐，钻进干水沟，绕过草丘，落进了池塘。',
  quote:'「刚才是什么声音？」'},
 {t:'一起听海',sub:'第七页 · 池塘边',scene:'pond',light:'night',
  text:'萤火虫在池塘边飞来飞去。「海是什么样子的？」毛毛问。豆豆把贝壳举到两人中间：「你听——」',
  quote:'「是我家那边的海。今晚，我有点想它。」'},
 {t:'山上的小海',sub:'第八页 · 清晨',scene:'pond',light:'night',
  text:'第二天清晨，小羊们都跑来看这片「小小的海」。毛毛折了一只纸船放进池塘，豆豆举起贝壳：「欢迎来我的新家！」',
  quote:'从那天起，山上也有了一片小小的海。'}
];
const N=SP.length-1;

/* ---------- renderer / scene ---------- */
const cv=$('stage');
let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){$('load').firstElementChild.innerHTML='这个浏览器没法开启 3D 画面<small>请用电脑或手机上的 Chrome、Safari、Edge 打开，并确认已开启硬件加速。</small>';throw e}
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(34,1,.05,30);
const hemi=new THREE.HemisphereLight('#ffe2c8','#7a6a58',1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffc08a',2.2);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-1.4,right:1.4,top:1.4,bottom:-1.4,near:.1,far:8});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.01;scene.add(sun,sun.target);
const lamp=new THREE.PointLight('#ffb35c',0,.7,2);lamp.position.set(-.6,.26,-.38);scene.add(lamp);
const table=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:.28}));table.rotation.x=-PI/2;table.position.y=-.05;table.receiveShadow=true;scene.add(table);

/* ---------- assets ---------- */
const PNG=['shell','dd_stand','dd_step','dd_hold','mm_stand','mm_sleep','mount','house','hill','flowers','channel','pond','wave','water','drop','moon','grass','cover'];
const SVG=['sun','cloud','sea_far','sea_front','hut','parasol','gull','rowboat','pine','truck','sign','wall','bed','lamp','boxes','reeds','paperboat'];
const META={dd_hold:{shell:[0.7627,0.5013]},channel:{path:[[0.0223,0.0477],[0.0948,0.1112],[0.1362,0.2176],[0.1088,0.3313],[0.0509,0.4303],[0.0439,0.5306],[0.0898,0.6284],[0.1776,0.7127],[0.3074,0.7433],[0.4379,0.7066],[0.5659,0.6443],[0.6957,0.6271],[0.8084,0.6846],[0.8854,0.8264],[0.944,0.9169],[0.986,0.9438]]},pond:{inner:[0.0741,0.1442,0.9185,0.8736]}};
const TX={};
const asp=k=>TX[k].image.width/TX[k].image.height;
const loader=new THREE.TextureLoader();
async function loadAll(){
  const keys=[...PNG,...SVG];let n=0;
  await Promise.all(keys.map(k=>loader.loadAsync(`art/${k}.webp`).then(t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;TX[k]=t;$('lp').textContent=Math.round(++n/keys.length*100)+'%'})));
  await Promise.all(['36px "Noto Serif SC"','700 36px "Noto Serif SC"','60px "ZCOOL KuaiLe"'].map(f=>document.fonts.load(f,'大象的口袋海豆豆毛毛').catch(()=>0)));
}

/* ---------- layout constants (spread x -1..1, z -0.7..0.7; scene area z < 0.2) ---------- */
let CH,PD,pathW,curve,U5,ROAD;
const HOME=[-.74,-.3], SLOT=[.13,-.19];
const POND2={x:.08,z:-.17,rx:.52,rz:.23};
const ROADPTS=[[-1.02,.16],[-.62,.1],[-.25,.02],[.02,-.14],[.3,-.3],[.62,-.38],[1.02,-.5]];
function layout(){
  CH={x0:-.58,z0:-.47,w:1.2};CH.d=CH.w/asp('channel');
  PD={cx:.74,cz:.05,w:.46};PD.d=PD.w/asp('pond');
  pathW=META.channel.path.map(([u,v])=>new THREE.Vector3(CH.x0+u*CH.w,.004,CH.z0+v*CH.d));
  curve=new THREE.CatmullRomCurve3(pathW);
  let b=0,bd=9;for(let i=0;i<=400;i++){const d=curve.getPointAt(i/400).distanceTo(pathW[5]);if(d<bd){bd=d;b=i/400}}U5=b;
  ROAD=new THREE.CatmullRomCurve3(ROADPTS.map(([x,z])=>new THREE.Vector3(x,0,z)));
}

/* ---------- page textures: each scene paints its own ground ---------- */
const CW=900, CHT=1260, SCN=.92/1.4*CHT;
function wrapText(c,txt,x,y,maxW,lh){let line='';for(const ch of txt){if(c.measureText(line+ch).width>maxW&&line){c.fillText(line,x,y);y+=lh;line=ch.trim()?ch:''}else line+=ch}if(line)c.fillText(line,x,y);return y+lh}
function paperBase(c){c.fillStyle='#f6eedf';c.fillRect(0,0,CW,CHT);const r=rng(7);for(let i=0;i<2600;i++){c.fillStyle=`rgba(120,90,60,${r()*.05})`;c.fillRect(r()*CW,r()*CHT,2,2)}}
function feltNoise(g,a=.06,seed=3){const r=rng(seed);for(let i=0;i<9000;i++){g.fillStyle=r()<.5?`rgba(255,255,255,${r()*a})`:`rgba(40,30,20,${r()*a})`;g.fillRect(r()*CW,r()*SCN,2,2)}}
const GROUND={
  hill(g,W){g.drawImage(TX.grass.image,0,0,CW,CW*TX.grass.image.height/TX.grass.image.width);
    const [cx,cy]=W(CH.x0,CH.z0);g.drawImage(TX.channel.image,cx,cy,CH.w*CW,CH.d/1.4*CHT);
    const [px,py]=W(PD.cx-PD.w/2,PD.cz-PD.d/2);g.drawImage(TX.pond.image,px,py,PD.w*CW,PD.d/1.4*CHT)},
  beach(g,W){const gr=g.createLinearGradient(0,0,0,SCN);gr.addColorStop(0,'#c9ad7e');gr.addColorStop(.25,'#e4c992');gr.addColorStop(1,'#f0dbab');g.fillStyle=gr;g.fillRect(0,0,CW,SCN);
    const [,fy]=W(0,-.5);g.fillStyle='rgba(255,255,255,.9)';for(let x=-1;x<=1;x+=.05){const [px,py]=W(x,-.5+Math.sin(x*9)*.012);g.beginPath();g.ellipse(px,py,26,9,0,0,PI*2);g.fill()}
    g.fillStyle='rgba(120,160,170,.25)';g.fillRect(0,0,CW,fy-8);
    const r=rng(11);for(let i=0;i<70;i++){const x=r()*2-1,z=-.45+r()*.62,[px,py]=W(x,z);g.fillStyle=['#f3c6b8','#fbf1dc','#c9b08a','#e9a98f'][i%4];g.beginPath();g.ellipse(px,py,4+r()*6,3+r()*4,r()*3,0,PI*2);g.fill()}
    g.fillStyle='rgba(150,120,80,.35)';for(let i=0;i<9;i++){const x=-.6+i*.06,z=-.22+i*.012+(i%2)*.025,[px,py]=W(x,z);g.beginPath();g.ellipse(px,py,9,6,0,0,PI*2);g.fill()}
    feltNoise(g,.07,5)},
  road(g,W){g.drawImage(TX.grass.image,0,0,CW,CW*TX.grass.image.height/TX.grass.image.width);
    const pts=ROAD.getPoints(80);const line=(w,col,dash)=>{g.beginPath();pts.forEach((p,i)=>{const [x,y]=W(p.x,p.z);i?g.lineTo(x,y):g.moveTo(x,y)});g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';g.setLineDash(dash||[]);g.stroke();g.setLineDash([])};
    line(.15*CW,'#a98a5e');line(.13*CW,'#d9bd8c');line(5,'rgba(255,250,240,.8)',[22,18]);
    const r=rng(5);g.fillStyle='rgba(120,95,60,.5)';for(let i=0;i<40;i++){const p=ROAD.getPoint(r()),[x,y]=W(p.x+(r()-.5)*.1,p.z+(r()-.5)*.08);g.beginPath();g.arc(x,y,3+r()*3,0,PI*2);g.fill()}},
  room(g,W){const ph=.075;for(let z=-.7,i=0;z<.25;z+=ph,i++){const [,y0]=W(0,z),[,y1]=W(0,z+ph);g.fillStyle=i%2?'#c99a66':'#bd8c58';g.fillRect(0,y0,CW,y1-y0);g.fillStyle='rgba(70,40,20,.35)';g.fillRect(0,y1-3,CW,3);
      const r=rng(i+1);for(let k=0;k<3;k++){const x=r()*2-1,[px]=W(x,0);g.fillRect(px,y0,3,y1-y0)}}
    const [cx,cy]=W(.05,-.12);g.save();g.translate(cx,cy);g.scale(1,(.17/1.4*CHT)/(.42*CW));
    g.fillStyle='#e07a5f';g.beginPath();g.arc(0,0,.42*CW,0,PI*2);g.fill();g.fillStyle='#e2b34a';g.beginPath();g.arc(0,0,.3*CW,0,PI*2);g.fill();
    g.fillStyle='#4d9a8f';g.beginPath();g.arc(0,0,.17*CW,0,PI*2);g.fill();
    g.strokeStyle='rgba(255,250,240,.8)';g.lineWidth=5;g.setLineDash([18,14]);for(const rr of[.39,.27,.14]){g.beginPath();g.arc(0,0,rr*CW,0,PI*2);g.stroke()}g.setLineDash([]);g.restore();
    feltNoise(g,.05,9)},
  pond(g,W){g.drawImage(TX.grass.image,0,0,CW,CW*TX.grass.image.height/TX.grass.image.width);
    const P=POND2,[cx,cy]=W(P.x,P.z),sx=P.rx*CW,sy=P.rz/1.4*CHT;
    g.fillStyle='#5f7d3a';g.beginPath();g.ellipse(cx,cy,sx*1.08,sy*1.12,0,0,PI*2);g.fill();

let AC=null,NB=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.04*w)/1.04;d[i]=l*3.2}}catch(e){}}if(AC?.state==='suspended')AC.resume();return SND?AC:null}
function noise(dur,f0,f1,vol,type='lowpass',att=.3){const A=ac();if(!A)return;const t=A.currentTime,s=A.createBufferSource();s.buffer=NB;s.loop=true;const f=A.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.linearRampToValueAtTime(f1,t+dur*.5);f.frequency.linearRampToValueAtTime(f0*.7,t+dur);
  const g=A.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*att);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f).connect(g).connect(A.destination);s.start(t);s.stop(t+dur+.05)}

function walk(a,x,z,o={}){
  const x0=a.g.position.x,z0=a.g.position.z,dist=Math.hypot(x-x0,z-z0),d=o.d||dist/(o.speed||.22)*1000;
  if(Math.abs(x-x0)>.005)a.face(x>x0?1:-1);
  const base=a.pose,alt=o.alt;let last=-1;
  return tween(d,t=>{a.at(lerp(x0,x,t),lerp(z0,z,t));const k=t*d/(o.hopMs||200);a.jump=Math.abs(Math.sin(k*PI))*(o.hop??.012);
    if(alt&&Math.floor(k)!==last){last=Math.floor(k);a.setPose(last%2?alt:base);if(o.snd&&last%2)o.snd()}},x=>x).then(()=>{a.jump=0;if(alt)a.setPose(base)})}

  async R=>{S.hoof();await R.all(R.walk(s1,.78,-.28,{speed:.14,hop:.016}),R.walk(s3,.82,-.01,{speed:.14,hop:.016}));await R.say(s1,'咩！山上怎么有海了？');await R.say(s3,'咩咩！')},
  async R=>{mm.face(1);await R.jump(mm,.04);await R.say(mm,'是豆豆从海边带来的！')},
  async R=>{await R.narr('毛毛折了一只纸船，放进池塘里。');boat.on=true;boat.f=0;boat.at(-.3,-.12);await R.tw(500,t=>{boat.f=t},eback);ripple(-.3,-.12,.7);
   await R.tw(4000,t=>{boat.at(lerp(-.3,.3,t),-.12-Math.sin(t*PI)*.08)},eio)},
  async R=>{await R.say(mm,'听，山上的风来了。');S.rustle();await R.tw(2400,t=>{for(const a of SCENE_PROPS.pond)if(a.poses.a.k==='reeds'||a.poses.a.k==='flowers')a.lean=Math.sin(t*PI*4)*.07;boat.at(.3+t*.08,-.12)},x=>x)},
  async R=>{R.cam(-.4,-.1,.85);await R.shell('up',600);const from=shellG.localToWorld(new THREE.Vector3(0,0,0));S.drip();await R.all(dropFall(from,.14,800),R.say(dd,'滴',{sfx:1,ms:700}));ripple(from.x+.14,POND2.z+.05,1.2);await R.shell('hand',500)},
  async R=>{await R.say(dd,'欢迎来我的新家——山上的小海！');await R.all(R.jump(dd,.05),R.jump(mm,.05),R.jump(s1,.04,420),R.jump(s3,.04,460))},
  async R=>{R.cam(0,-.2,1);await R.narr('从那天起，山上也有了一片小小的海。',{ms:3200});await R.say(dd,'— 完 —',{sfx:1,ms:2200})}
 ]
];
const SP_HUT=()=>SCENE_PROPS.beach.find(a=>a.poses.a.k==='hut');

/* ---------- page state, turning, playing, progress ---------- */
let cur=0,T=null,playing=false,stepI=0;
function setStatic(){
  const sL=T?(T.dir>0?T.from:T.to):cur,sR=T?(T.dir>0?T.to:T.from):cur;
  pageL.visible=sL>0;if(sL>0){pageL.material.map=pageL.material.emissiveMap=PT[sL].L}pageL.material.needsUpdate=true;
  pageR.material.map=pageR.material.emissiveMap=PT[sR].R;pageR.material.needsUpdate=true;
  halfL.visible=pageL.visible||!!T;
  if(T){const a=Math.min(T.from,T.to);leafF.material.map=leafF.material.emissiveMap=PT[a].R;leafB.material.map=leafB.material.emissiveMap=PT[a+1].Lm;leafF.material.needsUpdate=leafB.material.needsUpdate=true}
  leafF.visible=leafB.visible=!!T}
function prog(){const n=BEATS[cur].length,el=$('prog');el.style.display=n?'flex':'none';
  if(el.children.length!==n)el.innerHTML='<i></i>'.repeat(n);
  [...el.children].forEach((c,i)=>{c.className=i<stepI?'done':(i===stepI&&playing?'now':'')});el.setAttribute('aria-valuenow',stepI)}
function ui(){const s=SP[cur];$('ttl').textContent=s.t;$('sub').textContent=s.sub;$('cnt').textContent=cur?`${String(cur).padStart(2,'0')} / ${String(N).padStart(2,'0')}`:'封面';
  $('bPrev').disabled=cur===0;$('bNext').disabled=cur===N;$('bPlay').textContent=cur===0?'▶ 打开绘本':playing?'■ 停下':(stepI>=BEATS[cur].length?'↻ 再读一遍':'▶ 读这一页');prog()}
function stop(){RUN++;playing=false;clearBubs();try{speechSynthesis.cancel()}catch(e){}for(const a of ACT())a.talk=0;ui()}
function rise(){const list=POPS.filter(a=>a.on).sort((a,b)=>a.order-b.order);list.forEach(a=>a.f=0);
  S.rustle();return Promise.all(list.map((a,i)=>tween(200+i*55,()=>{},x=>x,false).then(()=>tween(650,t=>{a.f=t},eback,false))))}
async function play(){
  if(cur===0){go(1);return}
  stop();INIT[cur]();for(const a of POPS)if(a.on)a.f=1;mood(SP[cur].light,10,false);
  const tok=RUN;playing=true;stepI=0;ui();const Rr=mkR(tok);
  try{for(;stepI<BEATS[cur].length;){await BEATS[cur][stepI](Rr);if(tok!==RUN)throw ABORT;stepI++;prog()}}catch(e){if(e!==ABORT)console.error(e)}
  if(tok===RUN){playing=false;ui();camT.x=0;camT.z=CZ;camT.zoom=1}
}
function startTurn(dir){if(T)return false;const to=cur+dir;if(to<0||to>N)return false;
  stop();T={dir,from:cur,to,p:dir>0?0:1};setStatic();setLeaf(T.p);S.rustle();return true}
function animTurn(end){const p0=T.p,d=Math.abs(end-p0)*1100+150;T.anim=true;
  return tween(d,t=>{T.p=lerp(p0,end,t);setLeaf(T.p)},eio,false).then(()=>{const done=(T.dir>0&&end===1)||(T.dir<0&&end===0);
    if(done){const to=T.to;cur=to;stepI=0;INIT[cur]();for(const a of POPS)a.f=0;T=null;setStatic();ui();mood(SP[cur].light,1200,false);$('hint').style.opacity=0;
      camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;rise().then(()=>{if(cur===to&&!T&&cur>0)play()})}
    else{T=null;setStatic();ui()}})}
function go(i){if(T||i===cur||i<0||i>N)return;const dir=i>cur?1:-1;
  if(Math.abs(i-cur)>1){stop();cur=i-dir;INIT[cur]();for(const a of POPS)a.f=a.on?1:0;mood(SP[cur].light,300,false);setStatic()}
  if(startTurn(dir))animTurn(dir>0?1:0)}

/* ---------- camera ---------- */
const CZ=.02;
const camT={x:.5,z:CZ,zoom:.82},camC={x:.5,z:CZ,zoom:.82,px:0,py:0,az:0,el:54,uz:1},PTR={x:0,y:0};
const USER={az:0,el:54,zoom:1};
function fitD(){const a=innerWidth/innerHeight,v=34*PI/180,hf=2*Math.atan(Math.tan(v/2)*a);return Math.max(1.3/Math.tan(hf/2),1.16/Math.tan(v/2))}
function placeCam(dt){const k=1-Math.exp(-dt*2.2),k2=1-Math.exp(-dt*9);for(const q of['x','z','zoom'])camC[q]+=(camT[q]-camC[q])*k;camC.px+=(PTR.x-camC.px)*k;camC.py+=(PTR.y-camC.py)*k;
  camC.az+=(USER.az-camC.az)*k2;camC.el+=(USER.el-camC.el)*k2;camC.uz+=(USER.zoom-camC.uz)*k2;
  const D=fitD()*camC.zoom*camC.uz,el=(camC.el+camC.py*3)*PI/180,az=camC.az*PI/180+camC.px*.06;
  cam.position.set(camC.x+Math.sin(az)*Math.cos(el)*D,Math.sin(el)*D,camC.z+Math.cos(az)*Math.cos(el)*D);cam.lookAt(camC.x,0,camC.z)}
function resize(){R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight,true);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();let DR=null;
const PTS=new Map();let PINCH=null;
function onBook(e){v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);return ray.intersectObject(book,true).some(h=>h.object.visible&&h.object!==table)}
cv.addEventListener('pointerdown',e=>{ac();PTS.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  if(PTS.size===2){const [a,b]=[...PTS.values()];PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),z:USER.zoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,az:USER.az,el:USER.el};if(DR&&DR.t&&T&&!T.anim)animTurn(T.dir>0?0:1);DR=null;return}
  const orbit=e.button===2||e.shiftKey||!onBook(e);
  DR={x:e.clientX,y:e.clientY,t:false,orbit,az:USER.az,el:USER.el};if(orbit)cv.classList.add('orbit')});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();USER.zoom=clamp(USER.zoom*(1+e.deltaY*.0012),.45,1.7)},{passive:false});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){PTR.x=(e.clientX/innerWidth-.5)*2;PTR.y=(e.clientY/innerHeight-.5)*2}
  if(PTS.has(e.pointerId))PTS.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PINCH&&PTS.size===2){const [a,b]=[...PTS.values()],d=Math.hypot(a.x-b.x,a.y-b.y);USER.zoom=clamp(PINCH.z*PINCH.d/Math.max(20,d),.45,1.7);
    USER.az=PINCH.az-((a.x+b.x)/2-PINCH.mx)*.35;USER.el=clamp(PINCH.el+((a.y+b.y)/2-PINCH.my)*.2,18,84);return}
  if(!DR)return;const dx=e.clientX-DR.x;
  if(DR.orbit){if(Math.hypot(dx,e.clientY-DR.y)>4)DR.moved=true;USER.az=DR.az-dx*.4;USER.el=clamp(DR.el+(e.clientY-DR.y)*.25,18,84);return}
  if(!DR.t&&Math.abs(dx)>14&&!T){const flip=Math.cos(camC.az*PI/180)<0?-1:1,dir=(dx<0?1:-1)*flip;DR.flip=flip;if(startTurn(dir)){DR.t=true;cv.classList.add('drag');$('hint').style.opacity=0}}
  if(DR.t&&T&&!T.anim){const q=clamp(dx*-(DR.flip||1)*T.dir/(innerWidth*.45));T.p=T.dir>0?q:1-q;setLeaf(T.p)}});
cv.addEventListener('pointerup',e=>{PTS.delete(e.pointerId);if(PTS.size<2)PINCH=null;cv.classList.remove('drag','orbit');if(!DR)return;const d=DR;DR=null;if(d.orbit){if(!d.moved)poke(e);return}
  if(d.t&&T&&!T.anim){const p=T.dir>0?T.p:1-T.p;animTurn(p>.28?(T.dir>0?1:0):(T.dir>0?0:1));return}
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)poke(e)});
cv.addEventListener('pointercancel',e=>{PTS.delete(e.pointerId);PINCH=null;cv.classList.remove('drag','orbit');DR=null;if(T&&!T.anim)animTurn(T.dir>0?0:1)});
const POKE={'豆豆':['我叫豆豆！','贝壳里住着海哦。','嘿嘿，你好呀～','要不要一起听海？'],'毛毛':['咩～','我最熟悉这片山坡啦！','你好呀！'],'小羊':['咩！','咩咩～']};
function poke(e){if(playing||T)return;v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const hits=ray.intersectObjects([...POPS.filter(a=>a.on&&a.g.visible).map(a=>a.mesh),water]);if(!hits.length)return;
  const o=hits[0].object;if(o===water){if(FX.water>.5){ripple(hits[0].point.x,hits[0].point.z);S.drip()}return}
  const a=o.userData.actor;if(!a||BUBS.some(b=>b.a===a))return;
  if(a.pose==='sleep'){bubble(a,'Zzz…','sfx',1200);return}
  if(a===wave){S.wave(.4,1.4);bubble(a,'哗啦！','sfx',1100);return}
  if(a===gull){S.gull();bubble(a,'啾！','sfx',1000);return}
  if(a===truck){S.honk();bubble(a,'嘀嘀！','sfx',1000);return}
  const L=POKE[a.name];if(!L){jump(a,.02,300,false);S.pop();return}bubble(a,L[Math.floor(Math.random()*L.length)],'',1800);jump(a,.04);a===dd?S.pop():S.hoof()}

/* ---------- buttons ---------- */
$('bNext').onclick=()=>{ac();go(cur+1)};$('bPrev').onclick=()=>{ac();go(cur-1)};
$('bPlay').onclick=()=>{ac();if(playing){stop();camT.x=0;camT.z=CZ;camT.zoom=1}else play()};
$('bReset').onclick=()=>{camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;PTR.x=PTR.y=0;USER.az=Math.round(USER.az/360)*360;USER.el=54;USER.zoom=1};
$('bRotL').onclick=()=>{USER.az+=45};$('bRotR').onclick=()=>{USER.az-=45};
$('bSnd').onclick=e=>{SND=!SND;e.currentTarget.textContent='声音：'+(SND?'开':'关');e.currentTarget.setAttribute('aria-pressed',SND);if(!SND)try{speechSynthesis.cancel()}catch(_){}};
const SCN_NAME={beach:'沙滩',road:'山路',hill:'山坡',room:'圆屋里',pond:'池塘边'};
$('tocList').innerHTML=SP.map((s,i)=>`<li><button data-i="${i}"><span>${i?String(i).padStart(2,'0'):'封面'}</span>${s.t}${s.scene?`<em>${SCN_NAME[s.scene]}</em>`:''}</button></li>`).join('');
$('tocList').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('toc').classList.remove('on');go(+b.dataset.i)};
$('bToc').onclick=()=>$('toc').classList.add('on');$('bTocX').onclick=()=>$('toc').classList.remove('on');
$('toc').onclick=e=>{if(e.target.id==='toc')$('toc').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q')USER.az+=15;if(e.key==='e'||e.key==='E')USER.az-=15;if(e.key==='ArrowUp')USER.el=clamp(USER.el+5,18,84);if(e.key==='ArrowDown')USER.el=clamp(USER.el-5,18,84);if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();$('bPlay').click()}});

/* ---------- loop ---------- */
let last=performance.now();const V=new THREE.Vector3();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts;
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];if(w.tok!==null&&w.tok!==RUN){TW.splice(i,1);w.res();continue}
    const t=clamp((now-w.t0)/w.d);w.fn(w.ease(t));if(t>=1){TW.splice(i,1);w.res()}}
  const prog=T?(T.dir>0?T.p:1-T.p):0,G=T?clamp(1-prog/.3):1,t=ts/1000;
  const yaw=camC.az*PI/180;for(const a of POPS)a.update(t,G,yaw);
  const sw=.05*SH.k;shellG.visible=SH.k>.02&&dd.on;shellG.position.set(SH.x,SH.y,.012);shellM.scale.set(sw*asp('shell')*SH.sw,sw,1);shellM.position.y=-.5*sw;
  if(rib){rib.visible=SC==='hill'&&RB.b>RB.a+.001&&G>.05;const i0=Math.floor(RB.a*RIB),i1=Math.ceil(RB.b*RIB);rib.geometry.setDrawRange(i0*6,Math.max(0,i1-i0)*6);rib.material.opacity=.95*G;flowTex.offset.x-=dt*1.2;
    water.visible=SC==='hill'&&FX.water>.01;water.scale.set(WAT.w*Math.max(.02,FX.water),1,WAT.d*Math.max(.02,FX.water));water.material.opacity=Math.min(1,FX.water*1.3)*G}
  refl.visible=FX.refl>.01&&G>.05;refl.material.opacity=.6*FX.refl*G*(1+.15*Math.sin(t*2.3));refl.scale.set(1+.05*Math.sin(t*1.7),1,.7);
  for(const s of FF){const u=s.userData;s.visible=FX.ff>.01&&G>.3;if(!s.visible)continue;s.position.set(u.x+Math.sin(t*.5+u.ph)*.06,u.y+Math.sin(t*.9+u.ph*2)*.03,u.z+Math.cos(t*.4+u.ph)*.05);
    const k=.022*(.6+.4*Math.sin(t*3+u.ph));s.scale.set(k,k,1);s.material.opacity=FX.ff*G*(.55+.45*Math.sin(t*2.2+u.ph))}
  for(const m of RINGS)m.visible=G>.5;
  placeCam(dt);R.render(scene,cam);
  for(let i=BUBS.length-1;i>=0;i--){const b=BUBS[i];if(now>b.until||!b.a.g.visible){b.el.remove();BUBS.splice(i,1);continue}
    V.copy(b.a.top()).project(cam);b.el.style.left=clamp((V.x+1)/2*innerWidth,90,innerWidth-90)+'px';b.el.style.top=clamp((1-V.y)/2*innerHeight,80,innerHeight)+'px'}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async()=>{
  try{await loadAll()}catch(e){$('lp').textContent='图片加载失败，请刷新重试';return}
  layout();buildActors();dd.body.add(shellG);shellM.material.map=TX.shell;dropS.material.map=TX.drop;refl.material.map=TX.moon;buildWater();
  buildPages();resize();Object.assign(LS,moodSnap('day'));applyLS();INIT[0]();setStatic();ui();
  requestAnimationFrame(frame);
  setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700)},300);
  const h=location.hash.match(/^#p(\d)$/);if(h)setTimeout(()=>go(+h[1]),900);
})();
}
