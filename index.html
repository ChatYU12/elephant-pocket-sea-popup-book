<style>

:root{--a:#bfe6f2;--b:#f6e6c8;--ink:#2b2420;--paper:#f6eedf;--mustard:#d9a326;--deep:#1f2c55;--stitch:rgba(138,119,100,.34)}

header{position:fixed;left:16px;top:12px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}

.bub.think::before{content:"";position:absolute;left:calc(46% + var(--ax));bottom:-16px;width:14px;height:14px;border-radius:50%;background:rgba(255,250,240,.94);border:2px dashed #6b7bb8;margin:0}
.bub.think::after{content:"";position:absolute;left:calc(40% + var(--ax));bottom:-30px;width:8px;height:8px;border-radius:50%;background:rgba(255,250,240,.94);border:2px dashed #6b7bb8;margin:0}

  .tools{gap:6px}
  .seg button{width:36px;min-height:38px;font-size:16px}

  button.icon{width:40px;font-size:17px}
  #hint{top:62px;font-size:12px;padding:5px 12px}
  .bar{gap:8px;padding:8px 10px 8px 13px;border-radius:16px}
  .bar .t strong{font-size:16.5px}
  .count{display:none}
  #cap{bottom:102px;font-size:14.5px;padding:8px 14px}
  .arrow{width:42px}
}
@media(prefers-reduced-motion:reduce){.bub,.prog i.now::after,button.guide,#load svg{animation:none}.prog i.now::after{opacity:.8}}

<script type="module">

{

const SP=[
 {t:'大象的口袋海',sub:'封面',light:'day'},
 {t:'海边的家',sub:'第一页 · 早晨的沙滩',scene:'beach',light:'day',

  if(el.children.length!==n)el.innerHTML=Array.from({length:n},(_,i)=>`<i data-s="${i}" title="第 ${i+1} 节拍"></i>`).join('');
  [...el.children].forEach((c,i)=>{c.className=i<stepI?'done':(i===stepI&&playing?'now':'')});el.setAttribute('aria-valuenow',stepI)}

  $('ttl').textContent=s.t;

function fitD(){const a=innerWidth/innerHeight,v=34*PI/180,hf=2*Math.atan(Math.tan(v/2)*a);return Math.max(1.3/Math.tan(hf/2),1.16/Math.tan(v/2))}

  if(PTS.size===2){const [a,b]=[...PTS.values()];PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),z:USER.zoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,az:USER.az,el:USER.el};if(DR&&DR.t&&T&&!T.anim)animTurn(T.dir>0?0:1);DR=null;return}
  const orbit=e.button===2||e.shiftKey||!onBook(e);
  DR={x:e.clientX,y:e.clientY,t:false,orbit,az:USER.az,el:USER.el};if(orbit)cv.classList.add('orbit')});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();USER.zoom=clamp(USER.zoom*(1+e.deltaY*.0012),.45,1.7);syncReset()},{passive:false});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){PTR.x=(e.clientX/innerWidth-.5)*2;PTR.y=(e.clientY/innerHeight-.5)*2}
  if(PTS.has(e.pointerId))PTS.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PINCH&&PTS.size===2){const [a,b]=[...PTS.values()],d=Math.hypot(a.x-b.x,a.y-b.y);USER.zoom=clamp(PINCH.z*PINCH.d/Math.max(20,d),.45,1.7);
    USER.az=PINCH.az-((a.x+b.x)/2-PINCH.mx)*.35;USER.el=clamp(PINCH.el+((a.y+b.y)/2-PINCH.my)*.2,18,84);syncReset();return}
  if(!DR)return;const dx=e.clientX-DR.x;
  if(DR.orbit){if(Math.hypot(dx,e.clientY-DR.y)>4)DR.moved=true;USER.az=DR.az-dx*.4;USER.el=clamp(DR.el+(e.clientY-DR.y)*.25,18,84);syncReset();return}
  if(!DR.t&&Math.abs(dx)>14&&!T){const flip=Math.cos(camC.az*PI/180)<0?-1:1,dir=(dx<0?1:-1)*flip;DR.flip=flip;if(startTurn(dir)){DR.t=true;cv.classList.add('drag');hideHint()}}
  if(DR.t&&T&&!T.anim){const q=clamp(dx*-(DR.flip||1)*T.dir/(innerWidth*.45));T.p=T.dir>0?q:1-q;setLeaf(T.p)}});
cv.addEventListener('pointerup',e=>{PTS.delete(e.pointerId);if(PTS.size<2)PINCH=null;cv.classList.remove('drag','orbit');if(!DR)return;const d=DR;DR=null;if(d.orbit){if(!d.moved)poke(e);return}
  if(d.t&&T&&!T.anim){const p=T.dir>0?T.p:1-T.p;animTurn(p>.28?(T.dir>0?1:0):(T.dir>0?0:1));return}
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)poke(e)});
cv.addEventListener('pointercancel',e=>{PTS.delete(e.pointerId);PINCH=null;cv.classList.remove('drag','orbit');DR=null;if(T&&!T.anim)animTurn(T.dir>0?0:1)});
const POKE={'豆豆':['我叫豆豆！','贝壳里住着海哦。','嘿嘿，你好呀～','要不要一起听海？'],'毛毛':['咩～','我最熟悉这片山坡啦！','你好呀！'],'小羊':['咩！','咩咩～']};
function poke(e){if(playing||T)return;
  if(cur===0){if(onBook(e))go(1);return}
  v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const hits=ray.intersectObjects([...POPS.filter(a=>a.on&&a.g.visible).map(a=>a.mesh),water]);if(!hits.length)return;
  const o=hits[0].object;if(o===water){if(FX.water>.5){ripple(hits[0].point.x,hits[0].point.z);S.drip()}return}
  const a=o.userData.actor;if(!a||BUBS.some(b=>b.a===a))return;
  if(a.pose==='sleep'){bubble(a,'Zzz…','sfx',1200);return}
  if(a===wave){S.wave(.4,1.4);bubble(a,'哗啦！','sfx',1100);return}
  if(a===gull){S.gull();bubble(a,'啾！','sfx',1000);return}
  if(a===truck){S.honk();bubble(a,'嘀嘀！','sfx',1000);return}
  if(a===frog){S.frog();jump(a,.05,360);bubble(a,'呱！','sfx',1000);return}
  if(a===bflyRoad||a===bflyHill||a===bflyPond){S.flutter();jump(a,.04,420);bubble(a,'扑棱棱～','sfx',1000);return}
  if(a===mailbox){S.bell();jump(a,.025,300);bubble(a,'叮当！','sfx',1000);return}
  if(a===lighthouse){S.chime();bubble(a,'亮晶晶 ✨','sfx',1100);return}
  if(a===windmill){S.rustle();tween(700,t=>{a.lean=Math.sin(t*PI*4)*.07},x=>x,false);bubble(a,'呼呼～','sfx',1000);return}
  if(a===starfish){S.pop();jump(a,.03,320);bubble(a,'☆','sfx',900);return}
  if(a===whaleToy){S.wave(.16,1.1);jump(a,.03,360);bubble(a,'呜——','sfx',1000);return}
  if(a===lantern){S.chime();jump(a,.015,280);bubble(a,'暖呼呼 ✨','sfx',1000);return}
  const L=POKE[a.name];if(!L){jump(a,.02,300);S.pop();return}const line=L[Math.floor(Math.random()*L.length)];bubble(a,line,'',1800);hush();speak(line,roleOf(a));jump(a,.04);a===dd?S.pop():S.hoof()}

/* ---------- buttons ---------- */
$('bNext').onclick=()=>{ac();go(cur+1)};$('bPrev').onclick=()=>{ac();go(cur-1)};
$('bPlay').onclick=()=>{ac();if(playing){stop();camT.x=0;camT.z=CZ;camT.zoom=1}else play()};
$('bReset').onclick=()=>{camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;PTR.x=PTR.y=0;USER.az=Math.round(USER.az/360)*360;USER.el=54;USER.zoom=1;syncReset()};
$('bRotL').onclick=()=>{USER.az+=45;syncReset()};$('bRotR').onclick=()=>{USER.az-=45;syncReset()};
$('bSnd').onclick=e=>{SND=!SND;const lbl='声音：'+(SND?'开':'关');e.currentTarget.textContent=SND?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',SND);e.currentTarget.setAttribute('aria-label',lbl);e.currentTarget.title=lbl;if(!SND)hush()};
$('tocList').innerHTML=SP.map((s,i)=>`<li><button data-i="${i}"><span class="num">${i?String(i).padStart(2,'0'):'封面'}</span>${s.t}<span class="cur-badge" style="display:none">当前</span>${s.scene?`<em class="tag"><i class="dot" style="background:${MOOD_DOT[s.light]||'#ccc'}"></i>${SCN_NAME[s.scene]}</em>`:''}</button></li>`).join('');
$('tocList').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('toc').classList.remove('on');go(+b.dataset.i)};
$('bToc').onclick=()=>{syncToc();$('toc').classList.add('on')};$('bTocX').onclick=()=>$('toc').classList.remove('on');
$('toc').onclick=e=>{if(e.target.id==='toc')$('toc').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q'){USER.az+=15;syncReset()}if(e.key==='e'||e.key==='E'){USER.az-=15;syncReset()}if(e.key==='ArrowUp'){USER.el=clamp(USER.el+5,18,84);syncReset()}if(e.key==='ArrowDown'){USER.el=clamp(USER.el-5,18,84);syncReset()}if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();$('bPlay').click()}});

/* ---------- loop ---------- */
let last=performance.now();const V=new THREE.Vector3();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts;
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];if(w.tok!==null&&w.tok!==RUN){TW.splice(i,1);w.res();continue}
    const t=clamp((now-w.t0)/w.d);w.fn(w.ease(t));if(t>=1){TW.splice(i,1);w.res()}}
  const prog=T?(T.dir>0?T.p:1-T.p):0,G=T?clamp(1-prog/.3):1,t=ts/1000;
  const yaw=camC.az*PI/180;for(const a of POPS)a.update(t,G,yaw);
  const sw=.05*SH.k;shellG.visible=SH.k>.02&&dd.on;shellG.position.set(SH.x,SH.y,.012);shellM.scale.set(sw*asp('shell')*SH.sw,sw,1);shellM.position.y=-.5*sw;
  if(rib){rib.visible=SC==='hill'&&RB.b>RB.a+.001&&G>.05;const i0=Math.floor(RB.a*RIB),i1=Math.ceil(RB.b*RIB);rib.geometry.setDrawRange(i0*6,Math.max(0,i1-i0)*6);rib.material.opacity=.95*G;flowTex.offset.x-=dt*1.2;
    water.visible=SC==='hill'&&FX.water>.01;water.scale.set(WAT.w*Math.max(.02,FX.water),1,WAT.d*Math.max(.02,FX.water));water.material.opacity=Math.min(1,FX.water*1.3)*G}
  refl.visible=FX.refl>.01&&G>.05;refl.material.opacity=.6*FX.refl*G*(1+.15*Math.sin(t*2.3));refl.scale.set(1+.05*Math.sin(t*1.7),1,.7);
  for(const s of FF){const u=s.userData;s.visible=FX.ff>.01&&G>.3;if(!s.visible)continue;s.position.set(u.x+Math.sin(t*.5+u.ph)*.06,u.y+Math.sin(t*.9+u.ph*2)*.03,u.z+Math.cos(t*.4+u.ph)*.05);
    const k=.022*(.6+.4*Math.sin(t*3+u.ph));s.scale.set(k,k,1);s.material.opacity=FX.ff*G*(.55+.45*Math.sin(t*2.2+u.ph))}
  for(const m of RINGS)m.visible=G>.5;
  placeCam(dt);R.render(scene,cam);
  for(let i=BUBS.length-1;i>=0;i--){const b=BUBS[i];if(now>b.until||!b.a.g.visible){b.el.remove();BUBS.splice(i,1);continue}
    if(b.until-now<220)b.el.classList.add('out');
    V.copy(b.a.top()).project(cam);const rx=(V.x+1)/2*innerWidth,cx=clamp(rx,105,innerWidth-105),cy=clamp((1-V.y)/2*innerHeight,86,innerHeight-130);
    b.el.style.left=cx+'px';b.el.style.top=cy+'px';b.el.style.setProperty('--ax',clamp(rx-cx,-72,72)+'px')}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async()=>{
  if(matchMedia('(pointer:coarse)').matches)$('hint').textContent='滑动翻页 · 双指旋转 · 点点角色';
  try{await loadAll()}catch(e){$('lp').textContent='图片加载失败，请刷新重试';return}
  layout();buildActors();dd.body.add(shellG);shellM.material.map=TX.shell;dropS.material.map=TX.drop;refl.material.map=TX.moon;buildWater();
  buildPages();resize();Object.assign(LS,moodSnap('day'));applyLS();INIT[0]();setStatic();ui();syncReset();
  requestAnimationFrame(frame);
  setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700)},300);
  setTimeout(hideHint,7000);
  const h=location.hash.match(/^#p(\d)$/);if(h)setTimeout(()=>go(+h[1]),900);
})();
}
